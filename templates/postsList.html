{{ define "postsList" }}
<html>
	{{ template "head" "browsin" }}
	<body>
		{{ template "header" }}
		<div class="centerWrap">
			<div class="center">
				<h2>Browsing</h2>
				{{ range . }}
				<p class="linkList">
					<span class="dark">↑{{ .VoteCount }} </span>
					<span>{{ template "postlink" . }} by
					{{ template "userlink" .Author }}</span>
				</p>
				{{ end }}
			</div>
		</div>
	</body>
</html>
{{ end }}
